# The runner's only way out (board-service spec §4.4). The allowlist is the
# filter file, mounted read-only at run time; it follows the model setting.
#
# 172.31.99.0/24, not the pre-rename runner's 172.30.99.0/24 -- see the note
# in etchwork/libexec/job.sh.
Port 8888
Listen 0.0.0.0
Timeout 600
Allow 172.31.99.0/24
ConnectPort 443
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterDefaultDeny Yes
FilterURLs Off
LogLevel Connect
MaxClients 20
