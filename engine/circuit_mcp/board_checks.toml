# Board checks: sourced constants and warning-only rule-of-thumb limits.
# every constant and limit, with where it came from. Limits marked "rule of
# thumb" are starting values: every check warns, never blocks (design 3.4),
# and the event log's worst values are what they get tuned from.

[copper.resistivity_ohm_m]
value = 1.68e-8
source = "https://en.wikipedia.org/wiki/Electrical_resistivity_and_conductivity"
quote = "copper: 1.68e-8 ohm m at 20 C"

[copper.thickness_mm]
value = 0.035
source = "https://jlcpcb.com/help/article/jlcpcb-copper-weight"
quote = "1 oz/ft2 copper: 34.8 um nominal, commonly 35 um (outer layers, JLCPCB standard)"

# Current each tier is checked at: its upper bound, so a drop is the worst the
# tier allows. gt_5a has no upper bound; it is checked at 10 A.
[tier_current_a]
lt_0_5a = 0.5
0_5a_to_2a = 2.0
2a_to_5a = 5.0
gt_5a = 10.0
source = "the net-class tiers (netclass_data.json); gt_5a at 10 A by assumption"

[limits.crystal_length_mm]
value = 10.0
source = "rule of thumb: keep crystal traces short and direct"

[limits.diff_pair_mismatch_mm]
value = 2.0
source = "rule of thumb for USB 2.0 full speed; high speed needs far tighter"

[limits.power_drop_fraction]
value = 0.02
source = "rule of thumb: 2 % of the rail at the tier's upper current"

# --- phase A: placement rules (design 4), checked before routing -------------

[limits.decoupling_mm]
value = 3.0
source = "rule of thumb: a decoupling capacitor's power pad within a few mm of the IC pin it serves"

[limits.crystal_mm]
value = 5.0
source = "rule of thumb: the crystal's pads within a few mm of the oscillator pins"

[limits.connector_edge_mm]
value = 1.0
source = "rule of thumb: a connector's courtyard at the board edge, so a cable can reach it"

# --- phase C: EMC checks (design 6) --------------------------------------------
#
# A trace radiates according to its signal's edge time, not its clock rate,
# and to the loop its return current takes. Fast nets are chosen by class and
# by name (design 11.4, as suggested); each has an assumed edge time. None of
# these is a simulation: they flag what deserves a person's look.

[emc.signal_speed_mm_per_ns]
value = 150.0
source = "rule of thumb: roughly half the speed of light on FR-4"

[emc.critical_fraction]
value = 0.1667
source = "rule of thumb: a trace longer than v * t_rise / 6 is electrically long"

[emc.edge_ns]
clock = 1.0
gpio = 2.0
diff_pair = 4.0
switch_node = 5.0
source = "assumptions: MCU GPIO edges ~2 ns; USB 2.0 full speed rises in 4-20 ns (the fastest used); clocks 1 ns; regulator switch nodes 5 ns"

[emc.name_words]
clock = ["CLK", "CLOCK", "MCLK", "BCLK"]
gpio = ["SCK", "MOSI", "MISO", "TX", "RX", "TXD", "RXD", "CS"]
switch_node = ["SW", "LX", "PH"]
source = "the net-name words that mark a fast net, matched as whole words (SPI_SCK). Not I2C (SCL, SDA): its lines rise through pull-ups, 300-1000 ns by the I2C spec"

[emc.plane_coverage]
value = 0.90
source = "rule of thumb: a fast net should run over its reference ground plane for nearly all its length"

[emc.sample_step_mm]
value = 0.5
source = "sampling interval along a trace for the plane checks"

[emc.gap_mm]
value = 2.0
source = "rule of thumb: an unfilled stretch this long between filled ground, under a fast net, is a gap its return current detours around (short breaks at via and pad antipads are ignored)"
